<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0f" />
    <title>Sem conexão · NeuxFin</title>
    <style>
        :root { --bg: #f6f8fa; --fg: #0b1220; --muted: #5b6474; --primary: #26c8a6; --primary-fg: #04241d; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b0b0f; --fg: #f4f4f5; --muted: #a1a1aa; } }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100dvh; display: grid; place-items: center;
            padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
            background: var(--bg); color: var(--fg);
            font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
            text-align: center;
        }
        main { max-width: 22rem; }
        h1 { font-size: 1.375rem; margin: 20px 0 8px; }
        p { color: var(--muted); margin: 0 0 24px; }
        button {
            min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
            background: var(--primary); color: var(--primary-fg); font: inherit; font-weight: 600; cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <svg viewBox="0 0 32 32" width="56" height="56" aria-hidden="true">
            <rect width="32" height="32" rx="9" fill="#26c8a6" />
            <path d="M9.5 23V10.5L20.5 21.5V9" fill="none" stroke="#04241d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M16.6 12.6L20.5 8.7L24.4 12.6" fill="none" stroke="#04241d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1>Você está sem conexão</h1>
        <p>Seus saldos são sempre calculados com dados atualizados. Reconecte-se para continuar.</p>
        <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
</body>
</html>
